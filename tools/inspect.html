<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><pre id="o">loading</pre><script type="module">
import * as THREE from 'three'; import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
const L=new FBXLoader(); const out={};
for(const f of ['a_idle','a_walk','a_cheer','b_idle','b_walk','b_cheer']){
  const o=await L.loadAsync('/models/'+f+'.fbx'); const r={anims:o.animations.map(a=>a.name+':'+a.duration.toFixed(2)+':'+a.tracks.length), scale:o.scale.toArray(), meshes:[], bones:0, firstBones:[], tracks:o.animations[0]?.tracks.slice(0,3).map(t=>t.name)};
  o.traverse(c=>{ if(c.isBone){r.bones++; if(r.firstBones.length<3) r.firstBones.push(c.name);} if(c.isMesh){ const ms=[].concat(c.material); r.meshes.push(c.name+' tris='+(c.geometry.index?c.geometry.index.count/3:c.geometry.attributes.position.count/3)+' mats='+ms.map(m=>m.name+'['+(m.map?m.map.image?.width+'x'+m.map.image?.height:'-')+(m.normalMap?' N':'')+(m.color?' #'+m.color.getHexString():'')+']').join(','));}});
  const b=new THREE.Box3().setFromObject(o); r.box=[b.min.toArray().map(v=>+v.toFixed(1)),b.max.toArray().map(v=>+v.toFixed(1))];
  out[f]=r; document.getElementById('o').textContent=JSON.stringify(out,null,1);
}
document.title='done';
</script></body></html>
